<div class="grid gap-5 lg:grid-cols-[minmax(0,1fr)_280px]">
  <section class="min-w-0" aria-labelledby="editor-canvas-title">
    <div
      class="overflow-auto rounded-2xl border border-slate-200 bg-white shadow-inner"
    >
      <svg
        #canvas
        class="block min-w-[760px] select-none touch-none bg-[radial-gradient(circle,_#cbd5e1_1px,_transparent_1px)] [background-size:20px_20px]"
        width="100%"
        [attr.height]="canvasHeight"
        [attr.viewBox]="'0 0 900 ' + canvasHeight"
        role="application"
        aria-label="Éditeur du diagramme de cas d’utilisation"
        (pointerdown)="clearSelection()"
        (pointermove)="moveDrag($event)"
        (pointerup)="endDrag($event)"
        (pointercancel)="endDrag($event)"
      >
        <defs>
          <marker
            id="bob-arrow"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="7"
            markerHeight="7"
            orient="auto-start-reverse"
          >
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
          </marker>
        </defs>

        @for (relationship of diagram.relationships; track relationship.id) {
        @if (element(relationship.from); as from) { @if
        (element(relationship.to); as to) {
        <line
          class="pointer-events-none"
          [attr.data-relationship-id]="relationship.id"
          [attr.x1]="from.x"
          [attr.y1]="from.y"
          [attr.x2]="to.x"
          [attr.y2]="to.y"
          stroke="#64748b"
          stroke-width="2"
          [attr.stroke-dasharray]="
            relationship.type === 'include' ||
            relationship.type === 'extend' ||
            relationship.type === 'dependency'
              ? '7 6'
              : null
          "
          [attr.marker-end]="
            relationship.type === 'include' ||
            relationship.type === 'extend' ||
            relationship.type === 'dependency'
              ? 'url(#bob-arrow)'
              : null
          "
        />
        @if (relationshipLabel(relationship)) {
        <text
          class="pointer-events-none"
          [attr.x]="(from.x + to.x) / 2"
          [attr.y]="(from.y + to.y) / 2 - 8"
          text-anchor="middle"
          font-size="13"
          fill="#475569"
        >
          {{ relationshipLabel(relationship) }}
        </text>
        } } } } @for (actor of diagram.actors; track actor.id) {
        <g
          class="cursor-grab active:cursor-grabbing"
          [attr.data-element-id]="actor.id"
          [attr.transform]="'translate(' + actor.x + ' ' + actor.y + ')'"
          (pointerdown)="startDrag($event, actor)"
        >
          @if (selectedId === actor.id) {
          <rect
            x="-68"
            y="-53"
            width="136"
            height="145"
            rx="14"
            fill="#d1fae5"
            stroke="#10b981"
            stroke-width="2"
            stroke-dasharray="6 4"
          />
          }
          <circle
            cy="-30"
            r="13"
            fill="white"
            [attr.stroke]="selectedId === actor.id ? '#047857' : '#0f172a'"
            stroke-width="3"
          />
          <path
            d="M 0 -17 L 0 23 M -22 -2 L 22 -2 M 0 23 L -18 52 M 0 23 L 18 52"
            fill="none"
            [attr.stroke]="selectedId === actor.id ? '#047857' : '#0f172a'"
            stroke-width="3"
            stroke-linecap="round"
          />
          <text
            y="76"
            text-anchor="middle"
            font-size="15"
            font-weight="600"
            fill="#0f172a"
          >
            {{ actor.name }}
          </text>
        </g>
        } @for (useCase of diagram.useCases; track useCase.id) {
        <g
          class="cursor-grab active:cursor-grabbing"
          [attr.data-element-id]="useCase.id"
          [attr.transform]="'translate(' + useCase.x + ' ' + useCase.y + ')'"
          (pointerdown)="startDrag($event, useCase)"
        >
          <ellipse
            rx="145"
            ry="48"
            [attr.fill]="selectedId === useCase.id ? '#d1fae5' : '#ecfdf5'"
            [attr.stroke]="selectedId === useCase.id ? '#047857' : '#059669'"
            [attr.stroke-width]="selectedId === useCase.id ? 4 : 2.5"
          />
          <text
            text-anchor="middle"
            dominant-baseline="middle"
            font-size="15"
            font-weight="600"
            fill="#064e3b"
          >
            {{ useCase.name }}
          </text>
        </g>
        }
      </svg>
    </div>
  </section>

  <aside
    class="sticky top-0 self-start rounded-2xl border border-slate-200 bg-white p-5 shadow-sm"
    aria-labelledby="selection-title"
  >
    <h3 id="selection-title" class="font-bold text-slate-900">
      Élément sélectionné
    </h3>
    @if (selectedElement; as selected) {
    <p class="mt-1 text-sm text-slate-500">
      {{ selected.kind === "actor" ? "Acteur" : "Cas d’utilisation" }}
    </p>
    <label
      for="selected-element-name"
      class="mt-5 block text-sm font-bold text-slate-700"
      >Nom</label
    >
    <textarea
      id="selected-element-name"
      type="text"
      [(ngModel)]="draftName"
      (keydown.enter)="applyName()"
      maxlength="160"
      rows="3"
      class="mt-2 w-full rounded-xl border border-slate-300 px-3 py-2.5 outline-none focus:border-emerald-500 focus:ring-4 focus:ring-emerald-100"
    >
    </textarea>
    <button
      type="button"
      (click)="applyName()"
      [disabled]="!draftName.trim()"
      class="mt-4 w-full rounded-xl bg-emerald-500 px-4 py-2.5 font-bold text-slate-950 hover:bg-emerald-400 disabled:cursor-not-allowed disabled:opacity-50"
    >
      Appliquer
    </button>
    <dl
      class="mt-6 grid grid-cols-2 gap-2 border-t border-slate-200 pt-4 text-xs text-slate-500"
    >
      <div>
        <dt class="font-bold">X</dt>
        <dd>{{ selected.x }}</dd>
      </div>
      <div>
        <dt class="font-bold">Y</dt>
        <dd>{{ selected.y }}</dd>
      </div>
    </dl>
    } @else {
    <p class="mt-3 text-sm leading-6 text-slate-500">
      Cliquez sur un acteur ou un cas d’utilisation pour le déplacer ou modifier
      son nom.
    </p>
    }
  </aside>
</div>
