<div class="overflow-auto rounded-2xl border border-slate-200 bg-white">
  <svg
    class="block min-w-[760px]"
    width="100%"
    [attr.height]="canvasHeight"
    [attr.viewBox]="'0 0 900 ' + canvasHeight"
    role="img"
    aria-label="Représentation statique du diagramme de cas d’utilisation"
  >
    <defs>
      <marker id="bob-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
      </marker>
    </defs>

    @for (relationship of diagram.relationships; track relationship.id) {
      @if (element(relationship.from); as from) {
        @if (element(relationship.to); as to) {
          <line
            [attr.x1]="from.x"
            [attr.y1]="from.y"
            [attr.x2]="to.x"
            [attr.y2]="to.y"
            stroke="#64748b"
            stroke-width="2"
            [attr.stroke-dasharray]="relationship.type === 'include' || relationship.type === 'extend' || relationship.type === 'dependency' ? '7 6' : null"
            [attr.marker-end]="relationship.type === 'include' || relationship.type === 'extend' || relationship.type === 'dependency' ? 'url(#bob-arrow)' : null"
          />
          @if (relationshipLabel(relationship)) {
            <text [attr.x]="(from.x + to.x) / 2" [attr.y]="(from.y + to.y) / 2 - 8" text-anchor="middle" font-size="13" fill="#475569">{{ relationshipLabel(relationship) }}</text>
          }
        }
      }
    }

    @for (actor of diagram.actors; track actor.id) {
      <g [attr.transform]="'translate(' + actor.x + ' ' + actor.y + ')'">
        <circle cy="-30" r="13" fill="white" stroke="#0f172a" stroke-width="3" />
        <path d="M 0 -17 L 0 23 M -22 -2 L 22 -2 M 0 23 L -18 52 M 0 23 L 18 52" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
        <text y="76" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">{{ actor.name }}</text>
      </g>
    }

    @for (useCase of diagram.useCases; track useCase.id) {
      <g [attr.transform]="'translate(' + useCase.x + ' ' + useCase.y + ')'">
        <ellipse rx="145" ry="48" fill="#ecfdf5" stroke="#059669" stroke-width="2.5" />
        <text text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="600" fill="#064e3b">{{ useCase.name }}</text>
      </g>
    }
  </svg>
</div>
