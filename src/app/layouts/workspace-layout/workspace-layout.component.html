<div class="min-h-screen bg-slate-50 text-slate-950">
  @if (sidebarOpen) {
    <button type="button" aria-label="Fermer la navigation" class="fixed inset-0 z-40 bg-slate-950/45 lg:hidden" (click)="sidebarOpen = false"></button>
  }

  <aside class="fixed inset-y-0 left-0 z-50 flex w-72 flex-col border-r border-slate-800 bg-slate-950 text-white transition-transform duration-200 lg:translate-x-0" [class.-translate-x-full]="!sidebarOpen" [class.translate-x-0]="sidebarOpen">
    <div class="flex h-20 items-center justify-between border-b border-white/10 px-6">
      <a routerLink="/dashboard" (click)="closeNavigation()" class="flex items-center gap-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-400">
        <span class="grid h-10 w-10 place-items-center rounded-xl bg-emerald-500 font-black text-slate-950">B</span>
        <span><strong class="block text-xl tracking-wide">BOB :)</strong><small class="block text-xs text-slate-400">UML Diagram Builder</small></span>
      </a>
      <button type="button" aria-label="Fermer le menu" class="rounded-lg p-2 text-slate-300 hover:bg-white/10 lg:hidden" (click)="sidebarOpen = false">✕</button>
    </div>

    <nav class="flex-1 overflow-y-auto px-4 py-6" aria-label="Navigation de l’espace BOB">
      <p class="px-3 text-xs font-semibold uppercase tracking-[0.18em] text-slate-500">Navigation</p>
      <div class="mt-3 space-y-1">
        <a routerLink="/dashboard" routerLinkActive="border-emerald-400 bg-emerald-500/15 text-white" [routerLinkActiveOptions]="{ exact: true }" (click)="closeNavigation()" class="flex items-center gap-3 rounded-xl border-l-4 border-transparent px-4 py-3 font-medium text-slate-300 transition hover:bg-white/5 hover:text-white"><span aria-hidden="true">▦</span>Dashboard</a>
        <a routerLink="/projects" routerLinkActive="border-emerald-400 bg-emerald-500/15 text-white" (click)="closeNavigation()" class="flex items-center gap-3 rounded-xl border-l-4 border-transparent px-4 py-3 font-medium text-slate-300 transition hover:bg-white/5 hover:text-white"><span aria-hidden="true">◇</span>Projets</a>
        <a routerLink="/diagrams" routerLinkActive="border-emerald-400 bg-emerald-500/15 text-white" (click)="closeNavigation()" class="flex items-center gap-3 rounded-xl border-l-4 border-transparent px-4 py-3 font-medium text-slate-300 transition hover:bg-white/5 hover:text-white"><span aria-hidden="true">⌘</span>Diagrammes</a>
      </div>
      <p class="mt-8 px-3 text-xs font-semibold uppercase tracking-[0.18em] text-slate-500">Organisation</p>
      <a routerLink="/history" routerLinkActive="border-emerald-400 bg-emerald-500/15 text-white" (click)="closeNavigation()" class="mt-3 flex items-center gap-3 rounded-xl border-l-4 border-transparent px-4 py-3 font-medium text-slate-300 transition hover:bg-white/5 hover:text-white"><span aria-hidden="true">↶</span>Historique</a>
      <p class="mt-8 px-3 text-xs font-semibold uppercase tracking-[0.18em] text-slate-500">Compte</p>
      <a routerLink="/settings" routerLinkActive="border-emerald-400 bg-emerald-500/15 text-white" (click)="closeNavigation()" class="mt-3 flex items-center gap-3 rounded-xl border-l-4 border-transparent px-4 py-3 font-medium text-slate-300 transition hover:bg-white/5 hover:text-white"><span aria-hidden="true">⚙</span>Paramètres</a>
    </nav>

    <div class="border-t border-white/10 p-4">
      <button type="button" (click)="logout()" class="flex w-full items-center gap-3 rounded-xl px-4 py-3 text-left font-medium text-slate-300 transition hover:bg-red-500/10 hover:text-red-300 focus:outline-none focus:ring-2 focus:ring-red-400"><span aria-hidden="true">⇥</span>Déconnexion</button>
    </div>
  </aside>

  <div class="min-h-screen lg:pl-72">
    <header class="sticky top-0 z-30 flex h-20 items-center justify-between border-b border-slate-200 bg-white/95 px-4 backdrop-blur sm:px-6 lg:px-8">
      <div class="flex items-center gap-3">
        <button type="button" aria-label="Ouvrir la navigation" [attr.aria-expanded]="sidebarOpen" class="rounded-xl border border-slate-200 p-2.5 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-emerald-500 lg:hidden" (click)="sidebarOpen = true">☰</button>
        <div><p class="text-xs font-bold uppercase tracking-widest text-emerald-600">Espace de travail</p><p class="font-semibold text-slate-900">BOB</p></div>
      </div>
      @if (currentUser$ | async; as user) {
        <div class="relative">
          <button type="button" class="flex items-center gap-3 rounded-xl p-1.5 text-left hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500" [attr.aria-expanded]="profileMenuOpen" (click)="profileMenuOpen = !profileMenuOpen">
            <span class="grid h-10 w-10 place-items-center rounded-full bg-emerald-100 text-sm font-bold text-emerald-800">{{ initials(user) }}</span>
            <span class="hidden sm:block"><strong class="block max-w-40 truncate text-sm">{{ user.name }}</strong><small class="block max-w-40 truncate text-slate-500">{{ user.email }}</small></span><span aria-hidden="true" class="text-slate-400">⌄</span>
          </button>
          @if (profileMenuOpen) {
            <div class="absolute right-0 mt-2 w-52 rounded-xl border border-slate-200 bg-white p-2 shadow-xl">
              <a routerLink="/settings" (click)="profileMenuOpen = false" class="block rounded-lg px-3 py-2 text-sm font-medium hover:bg-slate-100">Mon profil</a>
              <a routerLink="/settings" (click)="profileMenuOpen = false" class="block rounded-lg px-3 py-2 text-sm font-medium hover:bg-slate-100">Paramètres</a>
              <button type="button" (click)="logout()" class="mt-1 w-full rounded-lg border-t px-3 py-2 text-left text-sm font-medium text-red-600 hover:bg-red-50">Déconnexion</button>
            </div>
          }
        </div>
      }
    </header>
    <main class="min-w-0"><router-outlet /></main>
  </div>
</div>
